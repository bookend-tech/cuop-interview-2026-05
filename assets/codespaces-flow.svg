<svg xmlns="http://www.w3.org/2000/svg" width="920" height="220" viewBox="0 0 920 220" role="img" aria-labelledby="title desc">
  <title id="title">Codespaces interview flow</title>
  <desc id="desc">GitHub repository, fork, Codespace, solve assignments, submit flow</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2563eb" />
    </marker>
  </defs>
  <rect width="920" height="220" rx="18" fill="#f8fafc" />
  <g fill="#ffffff" stroke="#cbd5e1" stroke-width="2">
    <rect x="34" y="62" width="150" height="96" rx="12" />
    <rect x="220" y="62" width="150" height="96" rx="12" />
    <rect x="406" y="62" width="150" height="96" rx="12" />
    <rect x="592" y="62" width="150" height="96" rx="12" />
    <rect x="778" y="62" width="108" height="96" rx="12" />
  </g>
  <g stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)">
    <line x1="188" y1="110" x2="212" y2="110" />
    <line x1="374" y1="110" x2="398" y2="110" />
    <line x1="560" y1="110" x2="584" y2="110" />
    <line x1="746" y1="110" x2="770" y2="110" />
  </g>
  <g font-family="Inter, Arial, sans-serif" text-anchor="middle">
    <text x="109" y="98" font-size="18" font-weight="700" fill="#111827">GitHub</text>
    <text x="109" y="124" font-size="15" fill="#475569">repo 접속</text>
    <text x="295" y="98" font-size="18" font-weight="700" fill="#111827">Fork</text>
    <text x="295" y="124" font-size="15" fill="#475569">본인 계정</text>
    <text x="481" y="98" font-size="18" font-weight="700" fill="#111827">Codespace</text>
    <text x="481" y="124" font-size="15" fill="#475569">생성</text>
    <text x="667" y="98" font-size="18" font-weight="700" fill="#111827">Solve</text>
    <text x="667" y="124" font-size="15" fill="#475569">과제 풀이</text>
    <text x="832" y="98" font-size="18" font-weight="700" fill="#111827">Submit</text>
    <text x="832" y="124" font-size="15" fill="#475569">push</text>
  </g>
</svg>
