<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>React State Update Interview Question</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        color: #1f2937;
        background: #f5f7fa;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
      }

      main {
        width: min(1120px, calc(100% - 32px));
        margin: 0 auto;
        padding: 32px 0 48px;
      }

      header {
        margin-bottom: 24px;
      }

      h1 {
        margin: 0 0 8px;
        font-size: clamp(28px, 4vw, 44px);
        line-height: 1.1;
        letter-spacing: 0;
      }

      p {
        margin: 0;
        line-height: 1.6;
      }

      .intro {
        max-width: 760px;
        color: #4b5563;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
        margin: 24px 0;
      }

      .panel {
        border: 1px solid #d9e0e8;
        border-radius: 8px;
        background: #ffffff;
        overflow: hidden;
      }

      .panel header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin: 0;
        padding: 16px;
        border-bottom: 1px solid #e5eaf0;
      }

      h2 {
        margin: 0;
        font-size: 18px;
        letter-spacing: 0;
      }

      .badge {
        flex: 0 0 auto;
        border-radius: 999px;
        padding: 4px 10px;
        font-size: 12px;
        font-weight: 700;
      }

      .bad {
        color: #9f1239;
        background: #ffe4e6;
      }

      .good {
        color: #166534;
        background: #dcfce7;
      }

      .content {
        padding: 16px;
      }

      .counter {
        display: grid;
        gap: 12px;
        margin-bottom: 16px;
      }

      .number {
        display: grid;
        place-items: center;
        min-height: 92px;
        border: 1px solid #d9e0e8;
        border-radius: 8px;
        background: #f8fafc;
        font-size: 42px;
        font-weight: 800;
        font-variant-numeric: tabular-nums;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      button {
        min-height: 40px;
        border: 1px solid #b9c4d0;
        border-radius: 8px;
        padding: 0 14px;
        color: #172033;
        background: #ffffff;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }

      button:hover {
        border-color: #64748b;
        background: #f8fafc;
      }

      pre {
        margin: 0;
        overflow: auto;
        border-radius: 8px;
        padding: 14px;
        color: #d7e3f4;
        background: #111827;
        font-size: 13px;
        line-height: 1.45;
      }

      .question {
        border: 1px solid #cfd8e3;
        border-radius: 8px;
        background: #ffffff;
        padding: 18px;
      }

      .question h2 {
        margin-bottom: 10px;
      }

      ol {
        margin: 10px 0 0;
        padding-left: 22px;
        line-height: 1.7;
      }

      li + li {
        margin-top: 4px;
      }

      @media (max-width: 760px) {
        main {
          width: min(100% - 24px, 1120px);
          padding-top: 24px;
        }

        .grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>React 상태 업데이트 면접 문제</h1>
        <p class="intro">
          버튼을 눌러 잘못된 업데이트와 함수형 업데이트의 차이를 확인하세요.
          특히 "두 번 증가" 버튼에서 React의 상태 배치 처리와 이전 상태 참조 문제가 드러납니다.
        </p>
      </header>

      <div id="root"></div>
    </main>

    <script type="text/babel">
      const { useState } = React;

      function BadCounter() {
        const [count, setCount] = useState(0);

        const increment = () => {
          setCount(count + 1);
        };

        const incrementTwice = () => {
          setCount(count + 1);
          setCount(count + 1);
        };

        return (
          <section className="panel" aria-label="잘못된 상태 업데이트 예시">
            <header>
              <h2>Incorrect Approach</h2>
              <span className="badge bad">stale value</span>
            </header>
            <div className="content">
              <div className="counter">
                <div className="number">{count}</div>
                <div className="actions">
                  <button type="button" onClick={increment}>1 증가</button>
                  <button type="button" onClick={incrementTwice}>두 번 증가</button>
                  <button type="button" onClick={() => setCount(0)}>초기화</button>
                </div>
              </div>
              <pre>{`const [count, setCount] = React.useState(0);

const increment = () => {
  count++; // Direct mutation
  setCount(count);
};

const incrementTwice = () => {
  setCount(count + 1);
  setCount(count + 1);
};`}</pre>
            </div>
          </section>
        );
      }

      function GoodCounter() {
        const [count, setCount] = useState(0);

        const increment = () => {
          setCount((prevCount) => prevCount + 1);
        };

        const incrementTwice = () => {
          setCount((prevCount) => prevCount + 1);
          setCount((prevCount) => prevCount + 1);
        };

        return (
          <section className="panel" aria-label="올바른 상태 업데이트 예시">
            <header>
              <h2>Correct Approach</h2>
              <span className="badge good">functional update</span>
            </header>
            <div className="content">
              <div className="counter">
                <div className="number">{count}</div>
                <div className="actions">
                  <button type="button" onClick={increment}>1 증가</button>
                  <button type="button" onClick={incrementTwice}>두 번 증가</button>
                  <button type="button" onClick={() => setCount(0)}>초기화</button>
                </div>
              </div>
              <pre>{`const [count, setCount] = React.useState(0);

const increment = () => {
  setCount((prevCount) => prevCount + 1);
};

const incrementTwice = () => {
  setCount((prevCount) => prevCount + 1);
  setCount((prevCount) => prevCount + 1);
};`}</pre>
            </div>
          </section>
        );
      }

      function App() {
        return (
          <>
            <div className="grid">
              <BadCounter />
              <GoodCounter />
            </div>

            <section className="question">
              <h2>면접 질문</h2>
              <p>
                위 두 코드를 비교해서 React에서 상태를 직접 변경하면 왜 문제가 되는지,
                그리고 함수형 업데이트가 어떤 상황에서 더 안전한지 설명하세요.
              </p>
              <ol>
                <li>React state를 직접 수정하면 안 되는 이유는 무엇인가요?</li>
                <li>연속으로 상태를 업데이트할 때 왜 이전 상태 값을 인자로 받아야 하나요?</li>
                <li>객체나 배열 state에서는 같은 문제가 어떻게 나타날 수 있나요?</li>
              </ol>
            </section>
          </>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
