<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>React State Update Practical Question</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="./hidden_expected.min.js"></script>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        color: #1f2937;
        background: #f5f7fa;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
      }

      main {
        width: min(1040px, calc(100% - 32px));
        margin: 0 auto;
        padding: 32px 0 48px;
      }

      h1,
      h2,
      h3,
      p {
        margin: 0;
      }

      h1 {
        margin-bottom: 8px;
        font-size: clamp(28px, 4vw, 42px);
        line-height: 1.1;
        letter-spacing: 0;
      }

      h2 {
        font-size: 20px;
        letter-spacing: 0;
      }

      h3 {
        font-size: 15px;
        letter-spacing: 0;
      }

      p,
      li {
        line-height: 1.65;
      }

      .intro {
        max-width: 760px;
        color: #4b5563;
      }

      .layout {
        display: grid;
        grid-template-columns: minmax(0, 0.95fr) minmax(0, 1.05fr);
        gap: 16px;
        margin-top: 24px;
      }

      .panel {
        border: 1px solid #d9e0e8;
        border-radius: 8px;
        background: #ffffff;
        overflow: hidden;
      }

      .panel-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 16px;
        border-bottom: 1px solid #e5eaf0;
      }

      .content {
        padding: 16px;
      }

      .counter {
        display: grid;
        gap: 14px;
      }

      .scoreboard {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }

      .score {
        border: 1px solid #d9e0e8;
        border-radius: 8px;
        padding: 12px;
        background: #f8fafc;
      }

      .label {
        display: block;
        margin-bottom: 4px;
        color: #64748b;
        font-size: 12px;
        font-weight: 700;
      }

      .number {
        font-size: 40px;
        font-weight: 800;
        font-variant-numeric: tabular-nums;
      }

      .status {
        border-radius: 8px;
        padding: 12px;
        font-weight: 800;
      }

      .pass {
        color: #166534;
        background: #dcfce7;
      }

      .fail {
        color: #9f1239;
        background: #ffe4e6;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      button {
        min-height: 40px;
        border: 1px solid #b9c4d0;
        border-radius: 8px;
        padding: 0 14px;
        color: #172033;
        background: #ffffff;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }

      button:hover {
        border-color: #64748b;
        background: #f8fafc;
      }

      .primary {
        border-color: #2563eb;
        color: #ffffff;
        background: #2563eb;
      }

      .primary:hover {
        border-color: #1d4ed8;
        background: #1d4ed8;
      }

      .note {
        color: #4b5563;
        font-size: 14px;
      }

      pre {
        margin: 12px 0 0;
        overflow: auto;
        border-radius: 8px;
        padding: 14px;
        color: #d7e3f4;
        background: #111827;
        font-size: 13px;
        line-height: 1.45;
      }

      ol {
        margin: 12px 0 0;
        padding-left: 22px;
      }

      li + li {
        margin-top: 4px;
      }

      details {
        margin-top: 14px;
        border-top: 1px solid #e5eaf0;
        padding-top: 14px;
      }

      summary {
        cursor: pointer;
        font-weight: 800;
      }

      @media (max-width: 820px) {
        main {
          width: min(100% - 24px, 1040px);
          padding-top: 24px;
        }

        .layout,
        .scoreboard {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>React 상태 업데이트 실습 문제</h1>
        <p class="intro">
          이 파일을 브라우저에서 열어 동작을 확인한 뒤, 소스 코드의
          <strong>TODO 영역</strong>만 수정해서 실제 count가 기대 count와 항상 같아지도록 만드세요.
        </p>
      </header>

      <div id="root"></div>
    </main>

    <script type="text/babel">
      const { useState } = React;

      function CandidateCounter() {
        const [count, setCount] = useState(0);
        const [expectedCount, setExpectedCount] = useState(0);
        const [lastAction, setLastAction] = useState("아직 실행한 동작이 없습니다.");

        const increment = () => {
          // TODO: 이 구현을 올바른 React state 업데이트 방식으로 수정하세요.
          setCount(count + 1);
        };

        const incrementTwice = () => {
          // TODO: 버튼을 한 번 눌렀을 때 count가 정확히 2 증가하도록 수정하세요.
          setCount(count + 1);
          setCount(count + 1);
        };

        const incrementFromAsyncCallback = () => {
          // TODO: 예약한 뒤 다른 버튼을 눌러도 최신 count 기준으로 1 증가하도록 수정하세요.
          setTimeout(() => {
            setCount(count + 1);
          }, 600);
        };

        const runIncrement = () => {
          setLastAction("1 증가: 실제 count와 기대 count가 각각 1씩 증가해야 합니다.");
          window.__hidden.incExpected(setExpectedCount);
          increment();
        };

        const runIncrementTwice = () => {
          setLastAction("두 번 증가: 버튼을 한 번 눌렀을 때 2 증가해야 합니다.");
          window.__hidden.incExpectedTwice(setExpectedCount);
          incrementTwice();
        };

        const runAsyncIncrement = () => {
          setLastAction("비동기 증가 예약: 0.6초 후 최신 count 기준으로 1 증가해야 합니다.");
          window.__hidden.incExpectedAsync(setExpectedCount);
          incrementFromAsyncCallback();
        };

        const reset = () => {
          setCount(0);
          setExpectedCount(0);
          setLastAction("초기화했습니다.");
        };

        const isPassing = count === expectedCount;

        return (
          <section className="panel" aria-label="React state update practical question">
            <div className="panel-header">
              <h2>실행 확인</h2>
              <span className={isPassing ? "status pass" : "status fail"}>
                {isPassing ? "PASS" : "FAIL"}
              </span>
            </div>
            <div className="content">
              <div className="counter">
                <div className="scoreboard">
                  <div className="score">
                    <span className="label">실제 count</span>
                    <span className="number">{count}</span>
                  </div>
                  <div className="score">
                    <span className="label">기대 count</span>
                    <span className="number">{expectedCount}</span>
                  </div>
                </div>

                <p className="note">{lastAction}</p>

                <div className="actions">
                  <button className="primary" type="button" onClick={runIncrement}>
                    1 증가
                  </button>
                  <button className="primary" type="button" onClick={runIncrementTwice}>
                    두 번 증가
                  </button>
                  <button className="primary" type="button" onClick={runAsyncIncrement}>
                    비동기 증가 예약
                  </button>
                  <button type="button" onClick={reset}>초기화</button>
                </div>
              </div>
            </div>
          </section>
        );
      }

      function App() {
        return (
          <div className="layout">
            <section className="panel">
              <div className="panel-header">
                <h2>과제</h2>
              </div>
              <div className="content">
                <p>
                  아래 세 함수의 <strong>TODO 영역</strong>을 직접 수정하세요.
                  수정 후 브라우저를 새로고침하고 모든 버튼 동작에서 PASS가 유지되어야 합니다.
                </p>
                <ol>
                  <li><code>increment</code>: count를 1 증가시킵니다.</li>
                  <li><code>incrementTwice</code>: 버튼 한 번에 count를 정확히 2 증가시킵니다.</li>
                  <li>
                    <code>incrementFromAsyncCallback</code>: 예약 후 다른 버튼을 눌러도 최신 count를 기준으로
                    1 증가시킵니다.
                  </li>
                </ol>

                <details>
                  <summary>힌트</summary>
                  <p className="note">
                    새 상태가 이전 상태에 의존한다면, 현재 렌더의 <code>count</code> 값을 직접 참조하는 방식이
                    안전하지 않을 수 있습니다.
                  </p>
                </details>

                <h3 style={{ marginTop: 18 }}>수정 대상 코드</h3>
                <pre>{`const increment = () => {
  // TODO: 이 구현을 올바른 React state 업데이트 방식으로 수정하세요.
  setCount(count + 1);
};

const incrementTwice = () => {
  // TODO: 버튼을 한 번 눌렀을 때 count가 정확히 2 증가하도록 수정하세요.
  setCount(count + 1);
  setCount(count + 1);
};

const incrementFromAsyncCallback = () => {
  // TODO: 예약한 뒤 다른 버튼을 눌러도 최신 count 기준으로 1 증가하도록 수정하세요.
  setTimeout(() => {
    setCount(count + 1);
  }, 600);
};`}</pre>
              </div>
            </section>

            <CandidateCounter />
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
